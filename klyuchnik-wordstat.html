<script>
'use strict';
const q = (selector) => document.querySelector(selector);
const icons = {
  key:'<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9m-3 3 3 3m-6 0 2 2"/>',
  folder:'<path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/>',
  campaign:'<path d="M3 10v4h4l11 4V6L7 10zm4 4 2 6m12-10v4"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  upload:'<path d="M12 16V4m-5 5 5-5 5 5M4 16v4h16v-4"/>'
};
function icon(name){return '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+icons[name]+'</svg>';}
function esc(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[char]);}
function trim(value){return String(value??'').trim();}
function number(value){return new Intl.NumberFormat('ru-RU').format(value);}
function money(value){return value ? number(value)+' ₽ / мес.' : 'Не указан';}
const files = [
  ['01_all_phrases.csv','Все собранные фразы'],
  ['02_empty_phrases.csv','Пустышки'],
  ['03_clean_no_empty.csv','Без пустышек'],
  ['04_irrelevant.csv','Нерелевантные фразы'],
  ['05_final_clean.csv','Итоговая семантика']
];
const statusText={review:'На проверке',revision:'На доработке',approved:'Подтверждена',sent:'Передана в Директ · демо'};
const storageKey='klyuchnik.workspace.v1';
function projectRecord(fields){return {...fields,id:globalThis.crypto?.randomUUID?.()??String(Date.now()),data:null,clusters:[],campaign:null};}
function workspaceDefaults(){
  const p=projectRecord({name:'Натяжные потолки',niche:'Замер и монтаж натяжных потолков',masks:['монтаж потолков','потолки с подсветкой','потолки для кухни'],region:'Казань',budget:30000,url:'https://example.com/potolki'});
  p.data=demoData(p);
  p.clusters=cluster(p.data.result,p.masks);
  return {projects:[p],active:p.id};
}
function load(){
  try{const saved=JSON.parse(localStorage.getItem(storageKey));if(Array.isArray(saved?.projects)&&saved.projects.length)return saved;}catch{}
  return workspaceDefaults();
}
const state=load();
let agentAvailable=false;
let bridgeReady=false;
let n8nStatus={};
let agentJob=null;
const pendingKey='klyuchnik.wordstat.job';

let page='semantics',selectedCluster=0,selectedGroup=0,query='',toastTimer;
const project=()=>state.projects.find(item=>item.id===state.active)??state.projects[0];
function save(){
  try{localStorage.setItem(storageKey,JSON.stringify(state));}
  catch{notify('Браузер не смог сохранить изменения. Они доступны до закрытия страницы.');}
}
function notify(text){
  clearTimeout(toastTimer);
  q('#toast').textContent=text;q('#toast').hidden=false;
  toastTimer=setTimeout(()=>{q('#toast').hidden=true;},5000);
}
function button(label,action,options={}){
  return '<button class="btn '+(options.primary?'primary ':'')+(options.small?'small':'')+'" type="button" data-action="'+action+'"'+(options.disabled?' disabled':'')+'>'+(options.icon?icon(options.icon):'')+esc(label)+'</button>';
}
function demoData(p){
  const example=p.masks.join('|')==='монтаж потолков|потолки с подсветкой|потолки для кухни';
  const phrases=example ? [
    ['монтаж натяжных потолков',320],['установка натяжного потолка',180],['монтаж потолков цена',140],
    ['натяжные потолки с подсветкой',210],['потолок с подсветкой цена',96],
    ['натяжные потолки для кухни',170],['потолки для кухни монтаж',65]
  ] : p.masks.flatMap((mask,index)=>[[mask,220-index*12],[mask+' цена',120-index*5],[mask+' заказать',65-index*2]]);
  const result=phrases.map(([phrase,freq])=>({phrase,freq}));
  const empty=[{phrase:p.masks[0]+' редко',freq:0}];
  const irrelevant=[{phrase:p.masks[0]+' вакансии',freq:52},{phrase:p.masks[0]+' своими руками',freq:70}];
  const noEmpty=[...result,...irrelevant];
  return {kind:'demo',result,files:[[...noEmpty,...empty],empty,noEmpty,irrelevant,result].map(csvRows)};
}
function csvRows(rows){
  const cell=value=>'"'+String(value).replaceAll('"','""')+'"';
  return 'phrase,freq\r\n'+rows.map(row=>cell(row.phrase)+','+row.freq).join('\r\n');
}
function parseCsv(text){
  const source=text.replace(/^\uFEFF/,'');
  const first=source.split(/\r?\n/,1)[0];
  const delimiter=first.includes(';')?';':first.includes('\t')?'\t':',';
  const records=[];let record=[],cell='',quoted=false;
  for(let i=0;i<source.length;i++){
    const ch=source[i];
    if(ch==='"'){
      if(quoted&&source[i+1]==='"'){cell+='"';i++;}else{quoted=!quoted;}
    }else if(!quoted&&ch===delimiter){record.push(cell);cell='';}
    else if(!quoted&&(ch==='\n'||ch==='\r')){
      if(ch==='\r'&&source[i+1]==='\n')i++;
      records.push([...record,cell]);record=[];cell='';
    }else{cell+=ch;}
  }
  if(quoted)throw Error('Незакрытые кавычки в CSV.');
  if(record.length||cell)records.push([...record,cell]);
  return records;
}
function finalRows(text){
  if(!text.trim())return [];
  const [header,...records]=parseCsv(text);
  const fields=(header??[]).map(value=>value.trim().toLowerCase());
  const phrase=fields.findIndex(value=>['phrase','keyword','фраза','ключевая фраза'].includes(value));
  const freq=fields.findIndex(value=>['freq','frequency','count','частотность'].includes(value));
  if(phrase<0||freq<0)throw Error('В итоговом CSV нужны колонки phrase и freq.');
  const result=new Map();
  for(const record of records){
    const value=trim(record[phrase]);
    const raw=trim(record[freq]).replace(/[\s\u00a0]/g,'');
    if(!value||value.startsWith('__'))continue;
    if(!/^\d+$/.test(raw)||!Number.isSafeInteger(Number(raw)))throw Error('Некорректная частотность для фразы «'+value+'».');
    const key=value.toLowerCase(),previous=result.get(key);
    if(Number(raw)>0&&(!previous||previous.freq<Number(raw)))result.set(key,{phrase:value,freq:Number(raw)});
  }
  return [...result.values()];
}
function terms(value){
  const stop = new Set(['и','на','для','по','с','в','у','из','за','до']);
  return new Set(value.toLowerCase().replaceAll('ё','е').split(/[^\p{L}\p{N}]+/u).filter(word=>word&&!stop.has(word)).map(word=>word.length>5?word.slice(0,5):word));
}
function cluster(rows,masks){
  const groups=masks.map((name,i)=>({name:name[0].toUpperCase()+name.slice(1),mask:name.toLowerCase(),terms:terms(name),rows:[],index:i}));
  const other={name:'Прочие запросы',rows:[]};
  for(const row of rows){
    const words=terms(row.phrase);
    const ranked=groups.map(group=>{
      const score=[...group.terms].filter(word=>words.has(word)).length;
      return {group,score,ratio:score/group.terms.size,exact:row.phrase.toLowerCase().includes(group.mask)};
    }).filter(item=>item.score>0).sort((a,b)=>b.score-a.score||b.ratio-a.ratio||Number(b.exact)-Number(a.exact)||a.group.index-b.group.index);
    (ranked[0]?.group??other).rows.push(row);
  }
  return [...groups,other].filter(group=>group.rows.length).map(group=>({name:group.name,rows:group.rows.sort((a,b)=>b.freq-a.freq||a.phrase.localeCompare(b.phrase,'ru'))}));
}
const periods={week:'в неделю',month:'в месяц'};
function defaultBrief(p){
  return {budget:p.budget||'',period:'month',counter:'',goal:'',instruction:'',site:p.url||'',optimize:'auto'};
}
function campaignBrief(p,c){
  const old=c?.brief;
  return {...defaultBrief(p),...old,optimize:old?.optimize??(old?.preset==='leads'?'leads':'auto')};
}
function wishParts(text){
  return text.replace(/([».!])\s+(?=[А-ЯЁ])/g,'$1\n').split(/[\r\n]+/).map(line=>trim(line).replace(/[.!?]$/,'')).filter(Boolean);
}
function decodeWish(line){
  const old=line.match(/^(расписание|минус-фразы|отдельная группа|добавить в текст|убрать из текста|utm|бюджет|регион|гео):\s*(.+)$/i);
  if(old)return [old[1].toLowerCase(),old[2]];
  const patterns=[
    ['отдельная группа',/^(?:вынеси(?:те)?|выдели(?:те)?)\s+(.+?)\s+(?:в отдельную группу|отдельно)$/i],
    ['отдельная группа',/^(.+?)\s+(?:вынеси(?:те)?|выдели(?:те)?)\s+(?:в отдельную группу|отдельно)$/i],
    ['минус-фразы',/^(?:добавь(?:те)?|включи(?:те)?)\s+(.+?)\s+в (?:общие )?минус-фразы$/i],
    ['минус-фразы',/^(?:исключи(?:те)?|минусуй(?:те)?)\s+(.+)$/i],
    ['добавить в текст',/^(?:в объявлениях\s+)?(?:упомяни(?:те)?|добавь(?:те)? в (?:текст|объявлени[яе]))\s+(.+)$/i],
    ['убрать из текста',/^(?:в объявлениях\s+)?(?:не обещай(?:те)?|не упоминай(?:те)?|убери(?:те)?(?: из (?:текста|объявлений))?)\s+(.+)$/i],
    ['расписание',/^(?:(?:показы|показывай(?:те)?|показывать)(?:\s+рекламу)?\s+)?(?:только\s+)?((?:по\s+)?будням|по будням|будни|каждый день|круглосуточно)(.*)$/i],
    ['бюджет',/^(?:бюджет\s+)?([\d ]+\s*(?:₽|рублей)?\s*в (?:неделю|месяц))$/i],
    ['регион',/^(?:гео|регион|география)\s+(.+)$/i],
    ['заявки',/^(?:(?:хочу|нужны|цель —)\s+заявки|(?:оптимизируй(?:те)?|оптимизация)\s+(?:под|на|для)\s+(?:заявок|заявки|конверсии))$/i]
  ];
  for(const [key,pattern] of patterns){
    const match=line.match(pattern);
    if(!match)continue;
    if(key==='расписание'){
      const days=/будн/i.test(match[1])?'будни':match[1].toLowerCase();
      const raw=trim(match[2]).replace(/^с\s+/i,'').replace(/\s+до\s+/i,'–');
      const times=raw.replace(/(^|[–—-]\s*)(\d{1,2})(?::(\d{2}))?(?=\s*[–—-]|$)/g,(_,lead,hour,minute)=>lead+hour.padStart(2,'0')+':'+(minute??'00'));
      return [key,[days,times].filter(Boolean).join(' ')];
    }
    return [key,(match[1]??'').trim()];
  }
  return null;
}
function buildBrief(p,brief){
  const settings={placement:'Поисковая выдача',region:p.region, strategy:'Максимум кликов',
    budget:brief.budget,period:brief.period,schedule:'Каждый день, круглосуточно',
    counter:brief.counter,goal:brief.goal,negative:[],utm:'utm_source=yandex&utm_medium=cpc&utm_campaign={campaign_id}&utm_content={ad_id}&utm_term={keyword}'};
  const problems=[], split=[], add=[], remove=[];
  let wantsLeads=brief.optimize==='leads';
  for(const line of wishParts(brief.instruction)){
    const command=decodeWish(line);
    if(!command){problems.push('Не удалось применить пожелание «'+line+'». Уточните или удалите его.');continue;}
    const [key,input]=command;
    const value=input.replace(/^[«“"]|[»”"]$/g,'').trim();
    switch(key){
      case 'расписание': {
        const time=value.match(/^(будни|каждый день)\s+(\d{2}):(\d{2})\s*[-–—]\s*(\d{2}):(\d{2})$/i);
        if(/^(круглосуточно|каждый день)$/i.test(value)){settings.schedule='Каждый день, круглосуточно';break;}
        if(/^будни$/i.test(value)){settings.schedule='Будни, круглосуточно';break;}
        if(!time||+time[2]>23||+time[4]>23||+time[3]>59||+time[5]>59||(+time[2]*60+ +time[3])>=(+time[4]*60+ +time[5])){
          problems.push('Укажите расписание в виде «будни 09:00–19:00» или «круглосуточно».');break;
        }
        settings.schedule=time[1]+' '+time[2]+':'+time[3]+'–'+time[4]+':'+time[5];
        break;
      }
      case 'минус-фразы': settings.negative.push(...input.split(/[,;]/).map(item=>trim(item).replace(/^[«“"]|[»”"]$/g,'')).filter(Boolean));break;
      case 'отдельная группа': split.push(value.trim());break;
      case 'добавить в текст': add.push(value.trim());break;
      case 'убрать из текста': remove.push(value.trim());break;
      case 'utm': settings.utm=value.trim().replace(/^\?/,'');break;
      case 'заявки': wantsLeads=true;break;
      case 'бюджет': {
        const amount=value.match(/^([\d\s]+)\s*(?:₽|рублей)?\s*(в неделю|в месяц)$/i);
        if(!amount||Number(amount[1].replace(/\s/g,''))!==brief.budget||amount[2].toLowerCase()!==periods[brief.period]){
          problems.push('Бюджет в задании («'+value+'») должен совпадать с полем бюджета и выбранным периодом.');
        }
        break;
      }
      case 'регион':
      case 'гео':
        if(value.toLowerCase()!==(p.region||'Все регионы').toLowerCase())problems.push('Регион «'+value+'» отличается от региона сбора. Измените регион в проекте или уточните задание.');
        break;
      default: problems.push('Уточните команду «'+line+'».');
    }
  }
  settings.negative=[...new Set(settings.negative)];
  if(!settings.budget)problems.push('Укажите бюджет и период.');
  wantsLeads=brief.optimize!=='clicks'&&(wantsLeads||Boolean(brief.counter||brief.goal));
  if(wantsLeads){
    settings.strategy='Максимум конверсий';
    if(!brief.counter||!brief.goal)problems.push('Для оптимизации под заявки укажите счётчик и цель Метрики или продолжите на кликах.');
  }else{
    settings.counter='';settings.goal='';
  }
  settings.site=brief.site;
  return {settings,problems,split,add,remove,needsGoal:wantsLeads&&(!brief.counter||!brief.goal)};
}

function changeSummary(before,after){
  if(!before)return [];
  const changes=[];
  const oldSettings=before.settings??{};
  const titles={strategy:'Стратегия',site:'Посадочная страница',budget:'Бюджет',period:'Период бюджета',schedule:'Расписание',negative:'Общие минус-фразы',counter:'Счётчик Метрики',goal:'Цель Метрики',utm:'UTM'};
  for(const [key,label] of Object.entries(titles)){
    if(JSON.stringify(oldSettings[key])!==JSON.stringify(after.settings[key]))changes.push('Кампания · '+label+' — '+(key==='period'?periods[after.settings[key]]:key==='budget'?after.settings[key]||'Уточнить':[].concat(after.settings[key]).filter(Boolean).join(', ')||'Не задано'));
  }
  const oldGroups=new Map(before.groups.map(group=>[group.name,group]));
  for(const group of after.groups){
    const old=oldGroups.get(group.name);
    if(!old){changes.push('Новая группа · '+group.name);continue;}
    const fields={keywords:'ключевые фразы',negative:'минус-фразы',title:'заголовок',description:'текст объявления',url:'посадочная страница'};
    const edited=Object.keys(fields).filter(key=>JSON.stringify(old[key])!==JSON.stringify(group[key])).map(key=>fields[key]);
    if(edited.length)changes.push(group.name+' · '+edited.join(', '));
    oldGroups.delete(group.name);
  }
  for(const name of oldGroups.keys())changes.push('Группа удалена · '+name);
  return changes;
}
function campaignBasis(c){return JSON.parse(JSON.stringify({settings:c.settings,groups:c.groups}));}
function draft(p,old,brief=campaignBrief(p,old)){
  const {settings,problems,split,add,remove,needsGoal}=buildBrief(p,brief);
  const oldGroups=new Map(old?.groups.map(group=>[group.name,group])??[]);
  const oldSite=campaignBrief(p,old).site;
  const adFields=(saved,name)=>({
    title:saved?.textBasis?.title??saved?.title??name,
    description:saved?.textBasis?.description??saved?.description??p.niche,
    url:saved?.url&&saved.url!==oldSite?saved.url:brief.site
  });
  const clusterNames=new Set(p.clusters.map(group=>group.name));
  const splitPhrases=new Set(old?.groups.flatMap(group=>group.splitFrom??(clusterNames.has(group.name)?[]:group.keywords))??[]);
  let groups=p.clusters.map(group=>{
    const existing=oldGroups.get(group.name);
    return {name:group.name,keywords:[...new Set([...(existing?.keywords??group.rows.map(row=>row.phrase)),...group.rows.filter(row=>splitPhrases.has(row.phrase)).map(row=>row.phrase)])],
      negative:existing?.negative??[],...adFields(existing,group.name)};
  });
  const used=new Set();
  for(const name of split){
    if(used.has(name.toLowerCase()))continue;
    used.add(name.toLowerCase());
    const words=terms(name);
    const matches=phrase=>words.size>0&&[...words].every(word=>terms(phrase).has(word));
    const exact=groups.find(group=>group.name.toLowerCase()===name.toLowerCase());
    const moved=[];
    const prior=oldGroups.get(name);
    const extras=prior?.keywords.filter(phrase=>!p.data?.result.some(row=>row.phrase===phrase))??[];
    const keywords=new Set([...(exact?.keywords??[]),...extras]);
    for(const group of groups){
      if(group===exact)continue;
      group.keywords=group.keywords.filter(phrase=>{
        if(!matches(phrase))return true;
        keywords.add(phrase);moved.push(phrase);return false;
      });
    }
    if(!keywords.size){problems.push('Для отдельной группы «'+name+'» нет подходящих фраз.');continue;}
    if(exact){exact.keywords=[...keywords];exact.splitFrom=[...(exact.splitFrom??[]),...moved];continue;}
    groups.push({name,keywords:[...keywords],splitFrom:moved,negative:prior?.negative??[],...adFields(prior,name)});
  }
  groups=groups.filter(group=>group.keywords.length);
  for(const group of groups){
    group.textBasis={title:group.title,description:group.description};
    for(const value of add){
      if(!group.description.toLowerCase().includes(value.toLowerCase()))group.description=group.description?group.description.replace(/[.!?]+$/,'')+'. '+value:value;
    }
    for(const value of remove){
      const literal=new RegExp(value.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'giu');
      group.title=group.title.replace(literal,'').replace(/\s+/g,' ').trim();
      group.description=group.description.replace(literal,'').replace(/\s+/g,' ').replace(/^[\s.,;:!?]+|[\s,;:]+$/g,'').trim();
    }
  }
  const result={status:'review',feedback:old?.feedback??'',version:(old?.version??0)+1,created:null,groups,settings,brief,problems,needsGoal};
  result.changes=changeSummary(old?.baseline??old,result);
  return result;
}

    c.groups.map((item,i)=>'<button type="button" class="'+(item===group?'active':'')+'" aria-pressed="'+(item===group)+'" data-action="group-select" data-index="'+i+'">'+esc(item.name)+'</button>').join('')+
    '</div></section><section class="card"><div class="card-head"><h2>'+esc(group.name)+'</h2>'+(review?button('Редактировать группу','edit',{small:true}):'')+'</div>'+
    '<div class="pad stack"><p class="muted smalltext">Регион группы · '+esc(settings.region||'Все регионы')+' · из проекта</p><h3>Ключевые фразы</h3>'+phrases(group.keywords)+'<h3>Минус-фразы группы</h3>'+phrases(group.negative)+
    '<div class="ad"><h3>Текстово-графическое объявление</h3><strong>'+esc(group.title)+'</strong><p>'+esc(group.description)+'</p>'+(href?'<a href="'+esc(href)+'" target="_blank" rel="noopener noreferrer">'+esc(group.url)+'</a>':'<p class="muted smalltext">Посадочная страница не указана</p>')+
    '</div></div></section></div><div class="actionbar">'+actions+'</div>';
}
function render(){
  const p=project();
  shell();
  q('#page').innerHTML=page==='projects'?projectsPage():page==='new'?projectForm():page==='campaign'?campaignPage(p):semanticsPage(p);
}
function changePage(target){
  page=target;query='';render();window.scrollTo(0,0);
}
function allowedUrl(value){
  if(!value)return '';
  try{const parsed=new URL(value);return ['http:','https:'].includes(parsed.protocol)?parsed.href:'';}catch{return '';}
}
function safeReset(p,apply){
  if(!p.campaign){apply();return;}
  if(p.campaign.status==='sent'){
    notify('Переданная кампания сохранена. Для нового сбора создайте другой проект.');
    return;
  }
  showDialog('Заменить семантику проекта?',
    '<p class="muted">Текущий черновик кампании будет сброшен.</p>',
    'Заменить',()=>{
      p.campaign=null;
      apply();
    });
}
function applyData(p,data){
  p.data=data;p.clusters=[];
  if(project()===p){selectedCluster=0;selectedGroup=0;query='';}
  save();render();
}
async function apiRequest(path,options){
  const response=await fetch(path,{cache:'no-store',...options});
  let data;
  try {data=await response.json();} catch {throw Error('Локальный мост ответил в неизвестном формате.');}
  if(!response.ok){
    const error=Error(data.message||'Запрос не выполнен.');
    error.field=data.field;
    throw error;
  }
  return data;
}
function openN8nSettings(){
  const dialog=q('#dialog');
  dialog.innerHTML='<form class="form"><h2 id="dialog-title">Подключение n8n</h2>'+
    field('url','Адрес n8n',n8nStatus.url||'http://127.0.0.1:5678','type="url" required')+
    field('key','API-ключ n8n','','type="password" required autocomplete="off"')+
    field('name','Точное название воркфлоу',n8nStatus.name||'Kluchnik','required maxlength="128"')+
    '<div id="folder-setting" hidden>'+field('folderId','Folder ID Yandex Cloud','','maxlength="128"')+'</div>'+
    '<p class="muted smalltext">Ключ нужен для настройки. Приложение создаст служебную копию агента в вашем n8n.</p>'+
    '<p id="n8n-error" class="notice error" role="status" hidden></p>'+
    '<div class="actionbar">'+button('Закрыть','close-dialog')+'<button type="submit" class="btn primary">Подключить</button></div></form>';
  dialog.setAttribute('aria-labelledby','dialog-title');
  const form=dialog.querySelector('form');
  form.addEventListener('submit',async event=>{
    event.preventDefault();
    const submit=form.querySelector('button[type="submit"]');
    const errorBox=form.querySelector('#n8n-error');
    const data=Object.fromEntries(new FormData(form));
    submit.disabled=true;submit.textContent='Подключение…';errorBox.hidden=true;
    try{
      n8nStatus=await apiRequest('/api/semantics/connect',{method:'POST',
        headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
      agentAvailable=n8nStatus.available;
      form.elements.key.value='';
      if(dialog.open&&dialog.contains(form))dialog.close();
      render();notify('Агент n8n подключён.');
    }catch(error){
      errorBox.textContent=error.message;errorBox.hidden=false;
      if(error.field==='folderId'){
        form.querySelector('#folder-setting').hidden=false;
        form.elements.folderId.required=true;
        form.elements.folderId.focus();
      }
    }finally{submit.disabled=false;submit.textContent='Подключить';}
  });
  dialog.showModal();
}
function storeAgentJob(job){
  try{if(job)localStorage.setItem(pendingKey,JSON.stringify(job));else localStorage.removeItem(pendingKey);}catch{}
}
function collectWordstat(p){
  if(p.campaign?.status==='sent'){notify('Для нового сбора создайте другой проект.');return;}
  const regionField=p.region?field('codes','Коды регионов Wordstat',p.regionCodes?.join(', ')||'','required placeholder="Числа через запятую"'):'';
  showDialog('Собрать семантику в Wordstat',
    '<p class="muted smalltext">Регион проекта · '+esc(p.region||'Все регионы')+'. '+(p.region?'Введите коды, соответствующие выбранному региону.':'Сбор пройдёт без регионального фильтра.')+'</p>'+
    regionField+(p.campaign?'<p class="muted smalltext">После успешного сбора прежний черновик будет сброшен.</p>':''),
    'Запустить сбор',data=>{
      const codes=trim(data.get('codes')).split(/[,;\s]+/).filter(Boolean);
      if(p.region&&(!codes.length||codes.some(code=>!/^\d{1,12}$/.test(code)))){notify('Введите числовые коды регионов Wordstat.');return false;}
      void startAgent(p,[...new Set(codes)]);
    });
}
async function startAgent(p,codes){
  const run={projectId:p.id,codes};
  agentJob=run;p.agentError='';render();
  try{
    const reply=await apiRequest('/api/semantics/jobs',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({masks:p.masks,niche:p.niche,regions:codes})});
    run.id=reply.id;storeAgentJob(run);
    await pollAgent(run,p);
  }catch(error){finishAgent(p,error.message);}
}
async function pollAgent(run,p){
  for(;;){
    const job=await apiRequest('/api/semantics/jobs/'+encodeURIComponent(run.id));
    if(job.status==='running'){await new Promise(resolve=>setTimeout(resolve,2000));continue;}
    if(job.status==='error')throw Error(job.message);
    if(job.status!=='done')throw Error('Получен неизвестный статус сбора.');
    const contents=files.map(([name])=>job.files?.[name]);
    if(contents.some(content=>typeof content!=='string'))throw Error('Для результата нужны пять CSV.');
    for(const content of contents)parseCsv(content);
    const result=finalRows(contents[4]);
    p.regionCodes=run.codes;p.campaign=null;
    finishAgent(p,'',{kind:'wordstat',files:contents,result,warning:job.warning});
    return;
  }
}
function finishAgent(p,message,data){
  agentJob=null;storeAgentJob(null);
  p.agentError=message;
  if(data){applyData(p,data);notify('Сбор завершён. Итоговых фраз: '+number(data.result.length)+'.');}
  else {save();render();notify(message);}
}
async function connectAgent(){
  if(!['127.0.0.1','localhost'].includes(location.hostname))return;
  try{
    n8nStatus=await apiRequest('/api/semantics/status');
    bridgeReady=true;agentAvailable=n8nStatus.available===true;
  }catch{return;}
  render();
  if(!agentAvailable)return;
  try{
    const run=JSON.parse(localStorage.getItem(pendingKey));
    const p=state.projects.find(item=>item.id===run?.projectId);
    if(!run?.id||!p)return;
    agentJob=run;render();
    try{await pollAgent(run,p);}catch(error){finishAgent(p,error.message);}
  }catch{}
}
function showDialog(title,content,submit,handler){
  const dialog=q('#dialog');
  dialog.innerHTML='<form class="form"><h2 id="dialog-title">'+esc(title)+'</h2>'+content+
    '<div class="actionbar">'+button('Отмена','close-dialog')+'<button type="submit" class="btn primary">'+esc(submit)+'</button></div></form>';
  dialog.setAttribute('aria-labelledby','dialog-title');
  dialog.querySelector('form').addEventListener('submit',event=>{
    event.preventDefault();
    const data=new FormData(event.currentTarget);
    if(handler(data)!==false)dialog.close();
  });
  dialog.showModal();
}
function listInput(value,limit=100){return [...new Set(String(value??'').split(/[\r\n]+/).map(trim).filter(Boolean))].slice(0,limit);}
function editGroup(p){
  const group=p.campaign.groups[selectedGroup];
  showDialog('Редактирование группы',
    field('title','Заголовок',group.title,'required maxlength="100"')+
    '<label class="field"><span>Текст объявления</span><textarea name="description" required maxlength="500">'+esc(group.description)+'</textarea></label>'+
    field('url','Посадочная страница',group.url,'type="url" maxlength="500"')+
    '<label class="field"><span>Ключевые фразы · по одной на строку</span><textarea name="keywords" required maxlength="5000">'+esc(group.keywords.join('\n'))+'</textarea></label>'+
    '<label class="field"><span>Минус-фразы · по одной на строку</span><textarea name="negative" maxlength="5000">'+esc(group.negative.join('\n'))+'</textarea></label>',
    'Сохранить',data=>{
      const title=trim(data.get('title')),description=trim(data.get('description')),url=trim(data.get('url'));
      const keywords=listInput(data.get('keywords'));
      if(!title||!description||!keywords.length){notify('Заполните заголовок, текст и ключевые фразы.');return false;}
      if(url&&!allowedUrl(url)){notify('Укажите ссылку с http:// или https://.');return false;}
      const before=campaignBasis(p.campaign);
      if(group.textBasis){
        if(title!==group.title)group.textBasis.title=title;
        if(description!==group.description)group.textBasis.description=description;
      }
      Object.assign(group,{title,description,url,keywords,negative:listInput(data.get('negative'))});
      if(p.campaign.status==='review'&&p.campaign.settings){
        p.campaign.changes=[...new Set([...(p.campaign.changes??[]),...changeSummary(before,p.campaign)])];
      }
      save();render();
    });
}
document.addEventListener('submit',event=>{
  if(event.target.id==='wishes-form'){
    event.preventDefault();
    const p=project(),data=new FormData(event.target);
    if(!['review','revision'].includes(p.campaign?.status))return;
    const instruction=trim(data.get('instruction'));
    const previous=campaignBrief(p,p.campaign);
    reviseDraft(p,{instruction,optimize:instruction!==previous.instruction&&previous.optimize==='clicks'?'auto':previous.optimize});
    return;
  }
  if(event.target.id!=='project-form')return;
  event.preventDefault();
  const data=new FormData(event.target);
  const name=trim(data.get('name')),niche=trim(data.get('niche')),url=trim(data.get('url'));
  const masks=listInput(data.get('masks'),50);
  if(!name||!niche||!masks.length){notify('Заполните название, тематику и базовые маски.');return;}
  if(url&&!allowedUrl(url)){notify('Укажите ссылку с http:// или https://.');return;}
  const p=projectRecord({name,niche,masks,region:trim(data.get('region')),budget:Number(data.get('budget')),url});
  state.projects.push(p);state.active=p.id;selectedCluster=0;selectedGroup=0;save();changePage('semantics');
});
document.addEventListener('click',event=>{
  const target=event.target.closest('button[data-action]');
  if(!target||target.disabled)return;
  const {action,id,index}=target.dataset;
  const p=project(),c=p.campaign;
  if(action.startsWith('nav-')){changePage(action.slice(4));return;}
  switch(action){
    case 'new': changePage('new');break;
    case 'open': state.active=id;selectedCluster=0;selectedGroup=0;save();changePage('semantics');break;
    case 'n8n-settings': if(bridgeReady&&!agentJob)openN8nSettings();break;
    case 'collect':
      if(agentJob)break;
      if(agentAvailable){collectWordstat(p);break;}
      if(p.data?.kind==='import'&&!p.campaign){
        showDialog('Загрузить демоданные?','<p class="muted">Демоданные заменят импортированные результаты в этом проекте.</p>','Загрузить',()=>applyData(p,demoData(p)));
      }else safeReset(p,()=>applyData(p,demoData(p)));
      break;
    case 'import': if(agentJob?.projectId!==p.id)q('#csv-input').click();break;
    case 'cluster': p.clusters=cluster(p.data.result,p.masks);selectedCluster=0;query='';save();render();break;
    case 'cluster-select': selectedCluster=Number(index);query='';render();break;
    case 'group-select': selectedGroup=Number(index);render();break;
    case 'csv-download': download(files[index][0],'\uFEFF'+p.data.files[index].replace(/^\uFEFF/,''),'text/csv;charset=utf-8');break;
    case 'generate':
      if(p.clusters.length&&agentJob?.projectId!==p.id){
        if(!c){p.campaign=draft(p);selectedGroup=0;save();}
        changePage('campaign');
      }
      break;
    case 'campaign-inputs': if(c&&['review','revision'].includes(c.status))editCampaignInputs(p);break;
    case 'campaign-goal': if(c&&['review','revision'].includes(c.status))editGoal(p);break;
    case 'campaign-clicks': if(c&&['review','revision'].includes(c.status))reviseDraft(p,{counter:'',goal:'',optimize:'clicks'});break;
    case 'change-region':
      if(agentJob?.projectId===p.id)break;
      if(c?.status==='sent'){notify('Для смены региона после передачи создайте другой проект.');break;}
      showDialog('Изменить регион проекта',
        field('region','Регион сбора и показа',p.region,'maxlength="80" placeholder="Все регионы"')+
        '<p class="muted smalltext">При смене региона нужно заново собрать или импортировать семантику. Кластеры и черновик этого проекта будут сброшены.</p>',
        'Изменить регион',data=>{
          const region=trim(data.get('region'));
          if(region.toLowerCase()===p.region.toLowerCase())return;
          p.region=region;p.regionCodes=[];p.agentError='';p.campaign=null;applyData(p,null);
        });
      break;
    case 'edit': if(c&&['review','revision'].includes(c.status))editGroup(p);break;
    case 'reject':
      if(c?.status!=='review')break;
      showDialog('Вернуть на доработку',
        '<label class="field"><span>Замечания к кампании</span><textarea name="feedback" required maxlength="1000"></textarea></label>',
        'Вернуть на доработку',data=>{
          const feedback=trim(data.get('feedback'));
          if(!feedback){notify('Укажите замечания к кампании.');return false;}
          c.baseline=campaignBasis(c);c.status='revision';c.feedback=feedback;save();render();
        });
      break;
    case 'resubmit': if(c?.status==='revision')reviseDraft(p,{});break;
    case 'approve':
      if(c?.status!=='review')break;
      showDialog('Подтвердить кампанию?',
        '<p class="muted">Подтверждена будет текущая версия черновика.</p>','Подтвердить',()=>{
          c.status='approved';save();render();
        });
      break;
    case 'send':
      if(c?.status!=='approved')break;
      showDialog('Передача в Яндекс Директ',
        '<p class="muted">Будет выполнена демонстрационная передача. Данные не отправляются в рекламный аккаунт.</p>',
        'Выполнить демопередачу',()=>{
          c.status='sent';c.created='DEMO-'+Date.now().toString(36).toUpperCase();save();render();
        });
      break;
    case 'package':
      if(c?.status==='sent')download('klyuchnik-campaign.json',JSON.stringify({mode:'demo',operation:c.created,project:p.name,version:c.version,campaign:c.settings??buildBrief(p,defaultBrief(p)).settings,groups:c.groups.map(group=>({
        name:group.name,region:p.region,keywords:group.keywords,negative:group.negative,
        ads:[{format:'textGraphic',title:group.title,description:group.description,url:group.url}]
      }))},null,2),'application/json');
      break;
    case 'close-dialog': q('#dialog').close();break;
  }
});
q('#page').addEventListener('input',event=>{
  if(event.target.id!=='query')return;
  query=event.target.value;
  const p=project();
  q('#rows').innerHTML=rowsMarkup(p.clusters[selectedCluster]?.rows??p.data?.result??[]);
});
q('#csv-input').addEventListener('change',async event=>{
  const selected=[...event.target.files],p=project();
  event.target.value='';
  if(!selected.length)return;
  try{
    const indexes=new Map(files.map(([name],index)=>[name,index]));
    const contents=Array(5).fill(null);
    const recognized=selected.filter(file=>indexes.has(file.name.toLowerCase()));
    if(!recognized.some(file=>indexes.get(file.name.toLowerCase())===4))throw Error('Выберите 05_final_clean.csv. Остальные четыре файла можно добавить в той же загрузке.');
    for(const file of recognized){
      const index=indexes.get(file.name.toLowerCase());
      if(contents[index]!==null)throw Error('Выбран дубликат файла '+file.name+'.');
      const text=await file.text();
      parseCsv(text);
      contents[index]=text;
    }
    const result=finalRows(contents[4]);
    if(project()!==p){notify('Проект изменился во время импорта. Повторите загрузку.');return;}
    safeReset(p,()=>{
      applyData(p,{kind:'import',result,files:contents});
      notify('Загружено файлов: '+recognized.length+'. Итоговых фраз: '+result.length+'.');
    });
  }catch(error){notify(error.message);}
});
save();render();void connectAgent();
</script>
